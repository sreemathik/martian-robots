name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.14.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.14.8'

      - name: Build
        run: gradle build --warning-mode none

      - name: Run tests
        run: gradle test --warning-mode none

      - name: Run sample input
        run: java -jar build/libs/martian-robots-1.0.jar < input.txt

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: martian-robots-jar
          path: build/libs/*.jar
