plugins {
    id 'java'
    id 'application'
}

group = 'com.martianrobots'
version = '1.0'
sourceCompatibility = '17'

application {
    mainClass = 'com.martianrobots.App'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    manifest {
        attributes 'Main-Class': 'com.martianrobots.App'
    }
}
